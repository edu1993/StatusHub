services:
  frontend:
    image: statushub-frontend-dev
    build:
      context: .
      target: build
    command: npm run dev -- --host 0.0.0.0
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - frontend_node_modules:/app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"

volumes:
  frontend_node_modules:
